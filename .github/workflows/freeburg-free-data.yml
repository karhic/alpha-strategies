name: Freeburg free-data utilities
on:
  push:
    branches: [agent/freeburg-free-data-20261011]
  pull_request:
    paths:
      - 'freeburg/tools/**'
      - 'freeburg/tests/**'
      - 'freeburg/prime_discount/**'
      - '.github/workflows/freeburg-free-data.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data import dependencies
        run: python -m pip install pandas requests numpy lxml html5lib openpyxl xlrd
      - name: Run all free data tests
        run: python -m unittest discover -s freeburg/tests -p 'test_*.py' -v
      - name: Compile Fed data builder
        run: python -m py_compile freeburg/prime_discount/build_fed_public_events.py freeburg/prime_discount/compare_sources.py
