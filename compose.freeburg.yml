services:
  freeburg:
    build:
      context: .
      dockerfile: Dockerfile.freeburg
    restart: "no"
    environment:
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-71}
      X_ENABLE_POSTING: "NO"
    volumes:
      - ./local:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["freeburg.deploy.healthcheck"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
